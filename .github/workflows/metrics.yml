name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: fwss09
          template: classic
          base: header, activity, community, metadata

          plugin_notable: yes
          plugin_notable_from: organization # варианты: all, organization, user
          plugin_notable_types: commit, pull_request # учитывать коммиты и ПРы
          plugin_notable_indepth: yes # включает детальный подсчет (выдаст бейджи со статистикой)
