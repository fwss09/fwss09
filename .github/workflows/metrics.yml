name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: fwss09
          template: classic
          base: header, activity, community, metadata

          config_padding: 16px, 16px
          
          extra_css: |
            :host {
              border: 2px dashed #8a2be2;
            }
